kind = "web"
previewPath = "/"
title = "AI Training Server Dashboard"
version = "1.0.0"
id = "artifacts/ai-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 3000
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/ai-dashboard run dev"

[services.env]
PORT = "3000"
BASE_PATH = "/"

[services.production]
build = "pnpm install && uv sync && pnpm --filter @workspace/api-server run build && BASE_PATH=/ pnpm --filter @workspace/ai-dashboard run build"
# DISABLE_PYTHON_SPAWN=1: this instance serves the dashboard + proxies /api,
# but must NEVER spawn/own the Python model server. Only the api-server
# artifact owns port 9878 — with two owners, both race at boot (Python takes
# >6s to open its port, so each thinks it's down and spawns its own copy),
# causing permanent lock contention and MaxBooster requests failing.
run = "DISABLE_PYTHON_SPAWN=1 pnpm --filter @workspace/api-server run serve"

[services.production.health.startup]
path = "/api/healthz"
