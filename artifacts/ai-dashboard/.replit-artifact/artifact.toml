kind = "web"
previewPath = "/"
title = "AI Training Server Dashboard"
version = "1.0.0"
id = "artifacts/ai-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 3000
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/ai-dashboard run dev"

[services.env]
PORT = "3000"
BASE_PATH = "/"

[services.production]
build = "pnpm install && uv sync && pnpm --filter @workspace/api-server run build && BASE_PATH=/ pnpm --filter @workspace/ai-dashboard run build"
# Featherweight static server only. The api-server artifact (port 8080) is
# the ONE real server — it serves the built dashboard AND all /api routes,
# and is the sole owner of the Python model server. Running a second full
# api-server here doubled memory + keepalive/deep-warm load and froze the
# production VM under render pressure.
run = "PORT=3000 API_PORT=8080 node artifacts/ai-dashboard/serve-static.mjs"

[services.production.health.startup]
path = "/healthz"
